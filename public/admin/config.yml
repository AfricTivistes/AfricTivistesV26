          - { label: "nav.projects", name: "nav.projects", widget: string }
          - { label: "nav.contact", name: "nav.contact", widget: string }
          - { label: "nav.engage", name: "nav.engage", widget: string }
          # ── Hero ──
          - { label: "hero.badge", name: "hero.badge", widget: string }
          - { label: "hero.title1", name: "hero.title1", widget: string }
          - { label: "hero.highlight", name: "hero.highlight", widget: string }
          - { label: "hero.title2", name: "hero.title2", widget: string }
          - { label: "hero.desc", name: "hero.desc", widget: text }
          - { label: "hero.cta1", name: "hero.cta1", widget: string }
          - { label: "hero.cta2", name: "hero.cta2", widget: string }
          # ── Contact ──
          - { label: "contact.title", name: "contact.title", widget: string }
          - { label: "contact.subtitle", name: "contact.subtitle", widget: string }
          - { label: "contact.name", name: "contact.name", widget: string }
          - { label: "contact.email", name: "contact.email", widget: string }
          - { label: "contact.subject", name: "contact.subject", widget: string }
          - { label: "contact.message", name: "contact.message", widget: string }
          - { label: "contact.send", name: "contact.send", widget: string }
          - { label: "contact.thanks", name: "contact.thanks", widget: string }
          - { label: "contact.reply", name: "contact.reply", widget: string }
          # ── Footer ──
          - { label: "footer.desc", name: "footer.desc", widget: text }
          - { label: "footer.rights", name: "footer.rights", widget: string }
          - { label: "footer.tagline", name: "footer.tagline", widget: string }

