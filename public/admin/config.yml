backend:
  name: git-gateway
  branch: main

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: translations
    label: Translations / Traductions
    description: "Site-wide i18n strings (FR & EN)"
    files:
      - name: fr
        label: "Fran\u00E7ais (FR)"
        file: src/data/translations/fr.json
        fields:
          # ── Navigation ──
          - { label: "nav.home", name: "nav.home", widget: string }
          - { label: "nav.about", name: "nav.about", widget: string }
          - { label: "nav.about.all", name: "nav.about.all", widget: string }
          - { label: "nav.about.index", name: "nav.about.index", widget: string }
          - { label: "nav.about.history", name: "nav.about.history", widget: string }
          - { label: "nav.about.values", name: "nav.about.values", widget: string }
