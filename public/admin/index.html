<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>AfricTivistes — Content Manager</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
  <style>
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; font-family: sans-serif; color: #555;
    }
  </style>
</head>
<body>
  <div id="loading">Chargement du CMS...</div>

  <script>
    window.CMS_MANUAL_INIT = true;

    (function () {
      var booted = false;

      // Track last-pinned playlist id at the UI level so a single click
      // on "épingler" auto-unpins the others. This works by watching the
      // CMS Redux store for changes on the playlists-data entry draft.
      function registerSinglePinEnforcement() {
        if (!window.CMS) return;

        // 1) Belt: enforce single-pin on save (server-side safety net)
        try {
          CMS.registerEventListener({
            name: 'preSave',
            handler: function (data) {
              var entry = data && data.entry;
              if (!entry) return;
              var slug = entry.get && entry.get('slug');
              if (slug !== 'playlists-data') return;

              var entryData = entry.get('data');
              if (!entryData || !entryData.get) return;
              var items = entryData.get('items');
              if (!items || !items.size) return;

              var pinnedIndices = [];
              items.forEach(function (item, idx) {
                if (item && item.get && item.get('pinned')) {
                  pinnedIndices.push(idx);
                }
              });
              if (pinnedIndices.length <= 1) return;

              // Keep the last pinned (most recently clicked)
              var keepIdx = pinnedIndices[pinnedIndices.length - 1];
              var newItems = items.map(function (item, idx) {
                return idx === keepIdx ? item : item.set('pinned', false);
              });
              return entryData.set('items', newItems);
            }
          });
        } catch (e) {
          console.warn('[CMS] preSave hook registration failed', e);
        }

        // 2) Suspenders: live single-select while editing.
        // Subscribe to the Redux store and, when the playlists-data draft
        // has multiple pinned items, immediately unpin the previously
        // pinned ones (keeping the one that just changed).
        try {
          var store = CMS.store || (CMS.getStore && CMS.getStore());
          if (!store || !store.subscribe) return;

          var lastPinnedSet = null;

          store.subscribe(function () {
            var state = store.getState();
            var entryDraft = state && (state.entryDraft || state.get && state.get('entryDraft'));
            if (!entryDraft) return;

            var entry = entryDraft.get ? entryDraft.get('entry') : entryDraft.entry;
            if (!entry || !entry.get) return;
            if (entry.get('slug') !== 'playlists-data') {
              lastPinnedSet = null;
              return;
            }

            var data = entry.get('data');
            if (!data || !data.get) return;
            var items = data.get('items');
            if (!items || !items.forEach) return;

            var pinned = [];
            items.forEach(function (item, idx) {
              if (item && item.get && item.get('pinned')) pinned.push(idx);
            });

            if (pinned.length <= 1) {
              lastPinnedSet = pinned.length === 1 ? pinned[0] : null;
              return;
            }

            // Determine which one was just newly pinned (not in last set)
            var newlyPinned = pinned[pinned.length - 1];
            if (lastPinnedSet !== null) {
              for (var i = 0; i < pinned.length; i++) {
                if (pinned[i] !== lastPinnedSet) { newlyPinned = pinned[i]; break; }
              }
            }

            // Dispatch CHANGE_DRAFT_FIELD for each item to unpin
            pinned.forEach(function (idx) {
              if (idx === newlyPinned) return;
              try {
                store.dispatch({
                  type: 'DRAFT_CHANGE_FIELD',
                  payload: {
                    field: ['items', String(idx), 'pinned'],
                    value: false
                  }
                });
              } catch (err) {
                // Fallback: build a new items list and dispatch full replace
              }
            });
            lastPinnedSet = newlyPinned;
          });
        } catch (e) {
          console.warn('[CMS] live single-pin enforcement unavailable', e);
        }
      }

      function getConfigPath(user) {
        var roles = (user && user.app_metadata && user.app_metadata.roles) || [];
        var isAdmin = roles.indexOf('admin') !== -1;
        var path = isAdmin
          ? '/admin/config-full.yml'
          : '/admin/config-restricted.yml';
        console.log('[CMS] roles:', roles, '| isAdmin:', isAdmin, '| config:', path);
        return path;
      }

      function bootCMS(configPath) {
        if (booted) return;
        booted = true;

        fetch(configPath)
          .then(function (r) { return r.text(); })
          .then(function (yml) {
            var cfg = jsyaml.load(yml);

            var el = document.getElementById('loading');
            if (el) el.remove();

            var script = document.createElement('script');
            script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
            script.onload = function () {
              CMS.init({ config: cfg });
              registerSinglePinEnforcement();
            };
            document.body.appendChild(script);
          })
          .catch(function (err) {
            console.error('CMS config load error:', err);
            document.getElementById('loading').textContent =
              'Erreur de chargement. Veuillez rafraîchir la page.';
          });
      }

      function initWithUser(user) {
        if (!user) return;
        // Refresh the JWT to get up-to-date roles from app_metadata
        if (typeof user.jwt === 'function') {
          user.jwt(true).then(function () {
            // After refresh, re-read user from the widget for fresh metadata
            var fresh = window.netlifyIdentity.currentUser();
            bootCMS(getConfigPath(fresh || user));
          }).catch(function () {
            bootCMS(getConfigPath(user));
          });
        } else {
          bootCMS(getConfigPath(user));
        }
      }

      // Listen for Netlify Identity events
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on('init', function (user) {
          if (user) {
            initWithUser(user);
          } else {
            // No user logged in — show login modal
            window.netlifyIdentity.open('login');
          }
        });
        window.netlifyIdentity.on('login', function (user) {
          initWithUser(user);
        });
      }
    })();
  </script>
</body>
</html>
